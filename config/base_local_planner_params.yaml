TrajectoryPlannerROS:
  # --- 1. İVME LİMİTLERİ ---
  acc_lim_x: 1.0       
  acc_lim_theta: 1.0   

  # --- 2. HIZ LİMİTLERİ ---
  max_vel_x: 0.20      
  min_vel_x: 0.05
  max_vel_theta: 0.4   
  min_vel_theta: -0.4
  # Robotun zemine tutunup ince açı ayarı yapabilmesi için minimum tork gücü:
  #min_in_place_vel_theta: 0.20 
  #escape_vel: -0.1     

  # --- 3. SİMÜLASYON SÜRESİ ---
  # Robot hedefe çok yakınken uzağı düşünmesin diye 1.5'e çekildi:
  sim_time: 1.5        

  # --- 4. HESAPLAMA YÜKÜNÜ AZALTMA ---
  vx_samples: 8
  vtheta_samples: 20
  
  # --- 5. ROBOT FİZİĞİ VE SÜRÜŞ AKICILIĞI ---
  holonomic_robot: false        
  # HATA BURADAYDI: Robot artık hedefin dibinde burnunu zorla çevirmeye çalışıp kilitlenmeyecek!
  heading_scoring: false        
  dwa: true                     
  
  # --- 6. HEDEF TOLERANSI (Gevşetildi) ---
  yaw_goal_tolerance: 0.25      # 0.15'ten 0.25'e (Açısal kilitlenmeyi çözer)
  xy_goal_tolerance: 0.20       # 0.15'ten 0.20'ye (Hedefin dibinde daha rahat durur)
  latch_xy_goal_tolerance: true 

  # --- 7. PUANLAMA (İSİMLER DÜZELTİLDİ VE KORKU DÜŞÜRÜLDÜ) ---
  meter_scoring: true         
  #pdist_scale: 0.6        # path_distance_bias YERİNE
  #gdist_scale: 0.8        # goal_distance_bias YERİNE
  #occdist_scale: 0.01     # Hedefin etrafındaki engellerden korkup kilitlenmemesi için düşürüldü.

TrajectoryPlannerROS:
  # --- 1. İVME LİMİTLERİ ---
  acc_lim_x: 1.0       
  acc_lim_theta: 1.5   

  # --- 2. HIZ LİMİTLERİ ---
  max_vel_x: 0.18      
  min_vel_x: 0.05
  max_vel_theta: 0.6   
  min_vel_theta: -0.6
  min_in_place_vel_theta: 0.3
  escape_vel: -0.1     # YENİ: Sıkışırsa geri geri kaçabilme yeteneği!

  # --- 3. SİMÜLASYON SÜRESİ ---
  sim_time: 2.0        

  # --- 4. HESAPLAMA YÜKÜNÜ AZALTMA ---
  vx_samples: 8
  vtheta_samples: 20
  
  # --- YENİ 5. ROBOT FİZİĞİ VE SÜRÜŞ AKICILIĞI (KRİTİK!) ---
  holonomic_robot: false        # Turtlebot yengeç gibi yan gidemez, bunu kesinlikle bilmeli!
  heading_scoring: true         # Rotaya önce burnunu çevirsin
  heading_scoring_timestep: 0.8 # Burnunu çevireceği rotanın ilerisine baksın
  dwa: true                     # Dar alanlarda pürüzsüz kıvrılma (Dinamik Pencere)
  
  # --- 6. HEDEF TOLERANSI ---
  yaw_goal_tolerance: 0.15  
  xy_goal_tolerance: 0.15   
  latch_xy_goal_tolerance: true # YENİ: Hedefe varınca milimlik düzeltme için dans etmeyi bıraksın

  # --- 7. PUANLAMA (DENGELİ AYARLAR) ---
  meter_scoring: true          
  path_distance_bias: 24.0     
  goal_distance_bias: 24.0     
  occdist_scale: 0.08

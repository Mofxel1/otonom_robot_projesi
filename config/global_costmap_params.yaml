global_costmap:
  global_frame: map
  robot_base_frame: base_footprint
  update_frequency: 2.0  
  publish_frequency: 0.5
  static_map: true       
  rolling_window: false
  transform_tolerance: 1.5
  resolution: 0.05
  always_send_full_costmap: true 
  
  plugins:
    - {name: static_layer,    type: "costmap_2d::StaticLayer"}
    - {name: gui_layer,       type: "costmap_2d::StaticLayer"}   # YENİ GUI KATMANI
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}  # MÜHENDİSİN GÖZLÜĞÜ GERİ GELDİ!
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  static_layer:
    enabled: true
    map_topic: "/map" 
    first_map_only: false        
    subscribe_to_updates: false  
    track_unknown_space: true
    use_maximum: true
    
  gui_layer:
    map_topic: "/gui_zones" 
    use_maximum: true
    trinary_costmap: false  # 0-100 arası tüm gri değerleri (50) okuyabilmesi için gerekli

  # BU KISMI İÇERİ (GİRİNTİLİ) OLARAK EKLİYORUZ:
  obstacle_layer:
    enabled: true
    observation_sources: scan
    scan: {sensor_frame: laser, data_type: LaserScan, topic: /scan, marking: true, clearing: true}

  inflation_layer:
    enabled: true
    cost_scaling_factor: 10.0   
    inflation_radius: 0.25
